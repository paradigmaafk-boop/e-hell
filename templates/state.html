<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта штата — центр + 2 слоя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0a0503;
        --line: #3a1a08;
        --text: #f8ecdf;
        --muted: #b88a62;

        /* Размер одной плитки (ромба) */
        --tile: 80px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0a0503;
        color: var(--text);
        min-height: 100vh;
        padding: 1.5rem 1rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        font-family: 'Forum', serif;
        font-size: 1.8rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ff4500, #ffb800, #ffec80, #ffb800, #ff4500);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: fireFlow 8s linear infinite;
        margin-bottom: 0.4rem;
    }
    @keyframes fireFlow {
        0%   { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    .sub {
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }

    /* ============================================================
       ЛЕГЕНДА
       ============================================================ */
    .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1.1rem;
        justify-content: center;
        max-width: 900px;
        margin-bottom: 2rem;
        padding: 0.9rem 1.25rem;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(20,10,5,0.6);
    }
    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        white-space: nowrap;
    }
    .legend-swatch {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        border: 1px solid #1a1209;
        transform: rotate(45deg);
    }

    /* ============================================================
       КАРТА
       ============================================================ */
    .map-wrap {
        padding: 3rem 2rem;
        background: rgba(20,10,5,0.5);
        border: 1px solid var(--line);
        border-radius: 16px;
        max-width: 100%;
        overflow: auto;
    }

    /* Сетка из ромбов.
       Ключевая идея: строки идут с шагом в половину плитки по вертикали,
       а каждая плитка — через отрицательные margin'ы — ставится в шахматку. */
    .map {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: max-content;
        margin: 0 auto;
        padding: 40px 0;
    }

    .row {
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(var(--tile) * 0.5);   /* высота ряда = половина плитки */
        position: relative;
    }

    /* Нечётные ряды — сдвиг на полплитки вправо */
    .row.offset {
        margin-left: calc(var(--tile) * 0.5);
    }

    /* ============================================================
       ПЛИТКА-РОМБ
       ============================================================ */
    .cell {
        position: relative;
        width: var(--tile);
        height: var(--tile);
        margin-left: calc(var(--tile) * -0.25);
        margin-top: calc(var(--tile) * -0.25);
        flex-shrink: 0;
        cursor: pointer;
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 1;
    }

    /* Ромб через clip-path */
    .cell::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #666;
        clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        border: 1px solid #1a1209;
        box-sizing: border-box;
    }

    /* Hover — приподнимаем */
    .cell:hover {
        transform: translateY(-8px) scale(1.08);
        z-index: 100;
    }

    .cell.empty {
        pointer-events: none;
        cursor: default;
    }
    .cell.empty::before { display: none; }

    /* Подпись внутри ромба */
    .cell-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Inter', sans-serif;
        font-size: 0.6rem;
        font-weight: 700;
        color: rgba(0,0,0,0.85);
        text-align: center;
        line-height: 1.05;
        padding: 10px;
        overflow: hidden;
        pointer-events: none;
        user-select: none;
        z-index: 2;
    }

    /* ============================================================
       ЦВЕТА — плоские
       ============================================================ */
    .cell.c-arcadia::before   { background: #ffc933; }
    .cell.c-military::before  { background: #e6392f; }
    .cell.c-research::before  { background: #9b5cc9; }
    .cell.c-megapolis::before { background: #ffa726; }
    .cell.c-city::before      { background: #66bb6a; }
    .cell.c-factory::before   { background: #26a69a; }
    .cell.c-village::before   { background: #a9b7c6; }

    .cell.c-bastion1::before  { background: #d3b98a; }
    .cell.c-bastion2::before  { background: #b89a6b; }
    .cell.c-bastion3::before  { background: #91764c; }
    .cell.c-bastion4::before  { background: #6f5833; }
    .cell.c-bastion5::before  { background: #4a3a20; }
    .cell.c-bastion6::before  { background: #2a1d0d; }

    .cell.c-trade::before {
        background: #e8e2d6;
        border-width: 2px;
    }

    /* Светлый текст на тёмных плитках */
    .cell.c-bastion4 .cell-label,
    .cell.c-bastion5 .cell-label,
    .cell.c-bastion6 .cell-label,
    .cell.c-research .cell-label,
    .cell.c-military .cell-label,
    .cell.c-city .cell-label,
    .cell.c-factory .cell-label {
        color: rgba(255,255,255,0.95);
    }

    /* ============================================================
       АДАПТИВ
       ============================================================ */
    @media (max-width: 900px) {
        :root { --tile: 60px; }
        .cell-label { font-size: 0.5rem; padding: 6px; }
    }
    @media (max-width: 600px) {
        :root { --tile: 42px; }
        .cell-label { font-size: 0.36rem; padding: 4px; }
    }
    @media (max-width: 420px) {
        :root { --tile: 32px; }
        .cell-label { display: none; }
    }
</style>
</head>
<body>

<h1>Карта штата</h1>
<p class="sub">Центр + 2 слоя вокруг Аркадии</p>

<div class="legend" id="legend"></div>

<div class="map-wrap">
    <div class="map" id="map"></div>
</div>

<style>
    .legend-swatch.c-arcadia   { background: #ffc933; }
    .legend-swatch.c-military  { background: #e6392f; }
    .legend-swatch.c-research  { background: #9b5cc9; }
    .legend-swatch.c-megapolis { background: #ffa726; }
    .legend-swatch.c-city      { background: #66bb6a; }
    .legend-swatch.c-factory   { background: #26a69a; }
    .legend-swatch.c-village   { background: #a9b7c6; }
    .legend-swatch.c-trade     { background: #e8e2d6; }
    .legend-swatch.c-bastion1  { background: #d3b98a; }
    .legend-swatch.c-bastion2  { background: #b89a6b; }
    .legend-swatch.c-bastion3  { background: #91764c; }
    .legend-swatch.c-bastion4  { background: #6f5833; }
    .legend-swatch.c-bastion5  { background: #4a3a20; }
    .legend-swatch.c-bastion6  { background: #2a1d0d; }
</style>

<script>
    /* ============================================================
       ТОЛЬКО ЦЕНТР + 2 СЛОЯ
       Слои от Аркадии:
         0 — Аркадия
         1 — Военная база
         2 — Бастион 6
         3 — Центр исследований
         4 — Бастион 5
       Максимальный радиус = 4.
       ============================================================ */
    (function() {
        const RADIUS = 4;
        const SIZE = RADIUS * 2 + 1;         // 9
        const CENTER = RADIUS;               // 4

        const map = document.getElementById('map');

        const layers = {
            0:  { cls: 'c-arcadia',   label: 'Аркадия', title: 'Аркадия (столица)' },
            1:  { cls: 'c-military',  label: 'Воен.',   title: 'Военная база' },
            2:  { cls: 'c-bastion6',  label: 'Бст.6',   title: 'Бастион ур.6' },
            3:  { cls: 'c-research',  label: 'Иссл.',   title: 'Центр исследований' },
            4:  { cls: 'c-bastion5',  label: 'Бст.5',   title: 'Бастион ур.5' },
        };

        for (let y = 0; y < SIZE; y++) {
            const row = document.createElement('div');
            row.className = 'row' + (y % 2 === 1 ? ' offset' : '');

            for (let x = 0; x < SIZE; x++) {
                const dx = x - CENTER;
                const dy = y - CENTER;
                const manhattan = Math.abs(dx) + Math.abs(dy);

                const cell = document.createElement('div');

                if (manhattan > RADIUS) {
                    cell.className = 'cell empty';
                    row.appendChild(cell);
                    continue;
                }

                const layer = layers[manhattan];
                const cls = layer ? layer.cls : 'c-bastion5';
                const label = layer ? layer.label : 'Бст.5';
                const title = layer ? layer.title : 'Бастион ур.5';

                cell.className = 'cell ' + cls;
                cell.title = title;

                const span = document.createElement('span');
                span.className = 'cell-label';
                span.textContent = label;
                cell.appendChild(span);

                row.appendChild(cell);
            }

            map.appendChild(row);
        }

        /* Легенда */
        const legendData = [
            { cls: 'c-arcadia',   label: 'Аркадия (столица)' },
            { cls: 'c-military',  label: 'Военная база' },
            { cls: 'c-research',  label: 'Центр исследований' },
            { cls: 'c-bastion5',  label: 'Бастион ур.5' },
            { cls: 'c-bastion6',  label: 'Бастион ур.6' },
        ];

        const legend = document.getElementById('legend');
        legendData.forEach(item => {
            const el = document.createElement('div');
            el.className = 'legend-item';
            const sw = document.createElement('span');
            sw.className = 'legend-swatch ' + item.cls;
            el.appendChild(sw);
            el.appendChild(document.createTextNode(item.label));
            legend.appendChild(el);
        });
    })();
</script>

</body>
</html>
