<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | [HEL] Ацкое Пламя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-emblem" style="margin: 0 auto 1rem;">
                <svg viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg">
                    <path class="flame-outline" d="M 20 4 C 20 4, 12 14, 12 22 C 12 28, 15 33, 20 33 C 25 33, 28 28, 28 22 C 28 14, 20 4, 20 4 Z" />
                    <path class="flame-inner" d="M 20 14 C 20 14, 16 20, 16 25 C 16 28, 18 30, 20 30 C 22 30, 24 28, 24 25 C 24 20, 20 14, 20 14 Z" />
                    <circle class="flame-dot" cx="20" cy="2" r="1.2" />
                    <line class="flame-base" x1="10" y1="40" x2="30" y2="40" />
                    <circle class="flame-dot" cx="20" cy="45" r="1.2" />
                </svg>
            </div>
        </div>
        <h1>Вход</h1>
        <p class="sub">Только для администратора</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="input-field">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" required autocomplete="username">
            </div>
            <div class="input-field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary">Войти</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" class="link-btn">← На главную</a>
        </div>
    </div>
</div>
</body>
</html>
