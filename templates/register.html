<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | [HEL] Ацкое Пламя</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Forum&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<svg width="0" height="0" style="position:absolute;" aria-hidden="true">
    <defs>
        <linearGradient id="fireStroke" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#ff2200"/>
            <stop offset="40%"  stop-color="#ff8800"/>
            <stop offset="70%"  stop-color="#ffcc00"/>
            <stop offset="100%" stop-color="#ff6600"/>
        </linearGradient>
        <linearGradient id="fireStroke2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#ffcc00"/>
            <stop offset="50%"  stop-color="#ff6600"/>
            <stop offset="100%" stop-color="#ff2200"/>
        </linearGradient>
        <radialGradient id="axisGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"   stop-color="#ffec80"/>
            <stop offset="40%"  stop-color="#ffb800"/>
            <stop offset="100%" stop-color="#ff4500" stop-opacity="0"/>
        </radialGradient>
    </defs>
</svg>

<div class="login-page">
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div class="brand-emblem" style="margin: 0 auto 1rem; width: 72px; height: 72px;">
                <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                    <circle class="ring-outer" cx="30" cy="30" r="24" />
                    <circle class="ring-inner" cx="30" cy="30" r="18" />
                    <g class="rotating-group">
                        <path class="beam" d="M 30 6 L 27 16 L 30 14 L 33 16 Z" />
                        <path class="beam" d="M 30 54 L 27 44 L 30 46 L 33 44 Z" />
                        <path class="beam" d="M 6 30 L 16 27 L 14 30 L 16 33 Z" />
                        <path class="beam" d="M 54 30 L 44 27 L 46 30 L 44 33 Z" />
                    </g>
                    <g class="rotating-group-reverse">
                        <path class="beam-diag" d="M 13 13 L 20 20 L 22 18 L 20 22 Z" />
                        <path class="beam-diag" d="M 47 47 L 40 40 L 38 42 L 40 38 Z" />
                        <path class="beam-diag" d="M 47 13 L 40 20 L 42 22 L 38 20 Z" />
                        <path class="beam-diag" d="M 13 47 L 20 40 L 22 42 L 18 40 Z" />
                    </g>
                    <circle class="axis-glow" cx="30" cy="30" r="7" />
                    <circle class="axis-core" cx="30" cy="30" r="2.4" />
                </svg>
            </div>
        </div>
        <h1>Регистрация</h1>
        <p class="sub">Создайте личный кабинет и привяжите себя к рейтингу</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-error">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}

        <form method="POST" autocomplete="off">
            <div class="input-field">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required autocomplete="off" minlength="2">
            </div>
            <div class="input-field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="new-password" minlength="4">
            </div>
            <div class="input-field">
                <label for="password2">Повторите пароль</label>
                <input type="password" id="password2" name="password2" required autocomplete="new-password" minlength="4">
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="/" class="link-btn">← На главную</a>
            <span style="color: var(--dim); margin: 0 0.5rem;">·</span>
            <a href="/login" class="link-btn">Вход для админа</a>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('theme-toggle');
    if (toggleBtn) {
        const body = document.body;
        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');
            toggleBtn.textContent = body.classList.contains('light-theme') ? '☀️' : '🌙';
            localStorage.setItem('theme', body.classList.contains('light-theme') ? 'light' : 'dark');
        });
        if (localStorage.getItem('theme') === 'light') {
            body.classList.add('light-theme');
            toggleBtn.textContent = '☀️';
        }
    }
</script>

</body>
</html>
